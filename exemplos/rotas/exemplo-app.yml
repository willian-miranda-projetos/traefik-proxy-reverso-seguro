# Rota dinâmica demonstrativa
# Encaminha as requisições para o contêiner whoami.

http:
  routers:
    exemplo-app:
      rule: "Host(`app.example.internal`)"
      entryPoints:
        - web
      service: exemplo-app

  services:
    exemplo-app:
      loadBalancer:
        servers:
          - url: "http://web-app:80"


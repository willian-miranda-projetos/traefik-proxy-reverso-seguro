# Configuração estática do Traefik
# Exemplo demonstrativo de proxy reverso HTTP.

api:
  dashboard: false

entryPoints:
  web:
    address: ":80"

providers:
  file:
    directory: /etc/traefik/dynamic
    watch: true

log:
  level: INFO

accessLog: {}


# Este é um exemplo HTTP para laboratório. Não representa uma configuração definitiva de produção com HTTPS.
